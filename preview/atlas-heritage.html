#atlas-heritage .at-brand-sub{font-size:9px;letter-spacing:.27em;color:#9ca4b0;margin-top:6px}
#atlas-heritage .at-primary-nav{display:flex;align-items:stretch;gap:4px;flex:1;justify-content:flex-end}
#atlas-heritage .at-primary-nav button{color:#c9cdd5;background:transparent;border:0;border-bottom:2px solid transparent;padding:12px 10px;font-size:12px;font-weight:600;white-space:nowrap}
#atlas-heritage .at-primary-nav button:hover{color:#fff;background:#181b20}
#atlas-heritage .at-primary-nav button[aria-pressed=true]{color:#fff;border-bottom-color:var(--at-blue)}
#atlas-heritage .at-panel-toggle{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;color:#c9cdd5;background:#1b1e24;border:1px solid #343942;border-radius:var(--at-radius);font-size:11px;white-space:nowrap}
#atlas-heritage .at-profile{position:absolute;right:0;top:calc(100% + 10px);width:min(318px,calc(100cqi - 28px));padding:0;background:#191c22;color:#f2f4f8;box-shadow:0 16px 40px #0007;border:1px solid #3a414e;border-top:2px solid #348dff;border-radius:3px;z-index:10;text-align:left}
#atlas-heritage .at-profile::before{content:&quot;&quot;;position:absolute;right:9px;top:-7px;width:10px;height:10px;background:#348dff;transform:rotate(45deg);z-index:-1}
#atlas-heritage .at-metrics,#atlas-heritage .at-login-form{background:var(--at-surface)}
#atlas-heritage[data-mode=dark] .at-banner-end{background:#090e16}
#atlas-heritage .at-profile-head{display:flex;gap:14px;align-items:center;padding:20px 18px;background:#12151a;border-bottom:1px solid #343a44;position:relative}
#atlas-heritage .at-profile-avatar{display:grid;place-items:center;width:60px;height:60px;flex-shrink:0}
#atlas-heritage .at-profile-avatar img{display:block;width:100%;height:100%;object-fit:contain}
#atlas-heritage .at-profile-identity{min-width:0;flex:1}
#atlas-heritage .at-profile-name{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}

@container atlas (max-width:540px){
  #atlas-heritage .at-utility{margin:0 14px;gap:8px;min-height:36px}
  #atlas-heritage .at-util-hide{display:none}
  #atlas-heritage .at-utility&gt;span{display:none}
  #atlas-heritage .at-utility-actions{grid-column:1/-1;justify-content:space-between}
  #atlas-heritage .at-navbar{padding:12px 14px;gap:10px}
  #atlas-heritage .at-wordmark{width:142px;height:31px}
  #atlas-heritage .at-brand-sub{letter-spacing:.1em;margin-top:3px}
  #atlas-heritage .at-primary-nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  #atlas-heritage .at-profile-head{padding:16px 14px;gap:11px}
  #atlas-heritage .at-profile-group{margin:0 4px;padding:8px 6px}
  #atlas-heritage .at-profile-footer{padding:13px 14px}
  #atlas-heritage .at-utility-actions{gap:10px}
  #atlas-heritage .at-profile button{min-height:44px}
  #atlas-heritage .at-content-wrap{padding:16px 14px 0}
  #atlas-heritage .at-banner{margin-bottom:20px}
  #atlas-heritage .at-banner-title{padding:12px 26px}
  #atlas-heritage .at-banner-title strong{font-size:20px}
  #atlas-heritage .at-banner-title .at-cap{font-size:11px;letter-spacing:0}
  #atlas-heritage .at-view-header{gap:10px;margin-bottom:18px}
  #atlas-heritage h1{font-size:25px;letter-spacing:-.5px}
  #atlas-heritage .at-subtitle{font-size:13px}
  #atlas-heritage .at-metrics{display:block;margin-bottom:18px}
  #atlas-heritage .at-metric{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:12px 14px;align-items:center}
  #atlas-heritage .at-metric+.at-metric{border-left:0;border-top:1px solid var(--at-line)}
  #atlas-heritage .at-metric-label{font-size:12px}
  #atlas-heritage .at-metric-label svg{flex-shrink:0}
  #atlas-heritage .at-metric strong{grid-column:2;grid-row:1/3;margin:0;font-size:23px;white-space:nowrap}
  #atlas-heritage .at-metric&gt;small{grid-column:1;font-size:11px;margin-top:3px}
  #atlas-heritage .at-metric strong small{font-size:12px}
  #atlas-heritage .at-kv{display:grid;grid-template-columns:minmax(0,1fr);gap:3px}
  #atlas-heritage .at-kv strong{text-align:left}
  #atlas-heritage .at-resource-line{flex-wrap:wrap;gap:4px 10px}
  #atlas-heritage .at-radio{grid-template-columns:32px minmax(0,1fr);padding:14px;gap:10px}
  #atlas-heritage .at-radio-icon{width:32px;height:36px}
  #atlas-heritage .at-radio .at-status{grid-column:2;justify-self:start}
  #atlas-heritage .at-form-footer{display:grid;grid-template-columns:1fr;width:100%;gap:8px}
  #atlas-heritage .at-form-footer .at-button-primary{grid-row:1}
  #atlas-heritage .at-log-row{grid-template-columns:65px minmax(0,1fr)}
  #atlas-heritage .at-log-row&gt;span:last-child{grid-column:1/-1}
  #atlas-heritage .at-footer{padding:15px;font-size:11px;align-items:flex-start;flex-direction:column}
  #atlas-heritage .at-detail{align-items:flex-start;flex-wrap:wrap;padding:14px}
}
@media(pointer:coarse){
  #atlas-heritage button{min-height:44px}
}
@media(prefers-reduced-motion:no-preference){#atlas-heritage button{transition:background .12s,color .12s,border-color .12s}}
