name: Check and build LuCI themes
on:
  push:
    branches: [main]
    paths: ['packages/**', 'scripts/**', 'design/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: luci-themes-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          node scripts/check-preview.mjs
          node scripts/check-atlas-preview.mjs
          node scripts/check-packages.mjs
          bash -n scripts/build-sdk.sh
      - name: Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd
      - name: Build development APKs using checksum-pinned official SDK
        run: bash scripts/build-sdk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axel-atlas-development-openwrt-25.12.5
          path: dist/
          if-no-files-found: error
          retention-days: 14
